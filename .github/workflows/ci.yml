name: CI

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality and migrations
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://yingchuan_test:yingchuan_test_local_only@127.0.0.1:5432/yingchuan_test?schema=public
      NODE_ENV: test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_DATABASE_URL: postgresql://yingchuan_test:yingchuan_test_local_only@127.0.0.1:5432/yingchuan_test?schema=public
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: yingchuan_test
          POSTGRES_PASSWORD: yingchuan_test_local_only
          POSTGRES_USER: yingchuan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U yingchuan_test -d yingchuan_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:8-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply migrations to an empty database
        run: npm run db:migrate:test

      - name: Verify migration deployment is idempotent
        run: npm run db:migrate:test

      - name: Load guarded test fixtures
        run: npm run db:fixtures:test

      - name: Run repository quality gate
        run: npm run check

      - name: Build production API image
        run: docker build --target api -f deploy/docker/Dockerfile .

      - name: Build production worker image
        run: docker build --target worker -f deploy/docker/Dockerfile .

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

  history-secret-scan:
    name: Git history secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Scan Git history
        uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2.3.9
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
